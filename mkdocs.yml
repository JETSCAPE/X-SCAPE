site_name: X-SCAPE Documentation
site_description: >-
  Documentation for X-SCAPE — the X-ion collisions with a Statistically and
  Computationally Advanced Program Envelope, the second-generation framework of
  the JETSCAPE Collaboration. Physics modules, framework architecture, and API
  reference.
site_author: The JETSCAPE Collaboration
site_url: https://jetscape.github.io/X-SCAPE/
repo_url: https://github.com/JETSCAPE/X-SCAPE
repo_name: JETSCAPE/X-SCAPE
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; The JETSCAPE Collaboration — distributed under the GNU
  General Public License v3.0 (GPLv3 or later).

docs_dir: docs

# These live under docs/ for discoverability but are build inputs, not pages,
# so keep them out of the published site.
exclude_docs: |
  Doxyfile
  requirements.txt
  README.md
  build_docs.sh

theme:
  name: material
  logo: assets/XscapeLogo.png
  favicon: assets/XscapeLogo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/diagram-zoom.js

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  # C++ API reference. mkdoxy runs Doxygen during `mkdocs build`/`serve` and
  # renders the result as native, Material-themed Markdown pages under /api/.
  # No separate Doxygen HTML site, and it works under the live-reload server.
  - mkdoxy:
      projects:
        api:
          src-dirs: src
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp *.cc *.cpp"
            RECURSIVE: True
            EXTRACT_ALL: True
            EXTRACT_PRIVATE: False
            EXTRACT_STATIC: True
            HIDE_UNDOC_MEMBERS: False

validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JETSCAPE/X-SCAPE
    - icon: material/web
      link: http://jetscape.org

nav:
  - Home: index.md
  - Framework:
      - framework/index.md
      - Architecture & Execution Model: framework/architecture.md
      - Tasks, Modules & the Factory: framework/tasks-modules.md
      - Signals & Data Flow: framework/signals.md
      - The Dynamical Clock: framework/clock.md
      - Bulk Dynamics Manager: framework/bulk-dynamics.md
      - XML Configuration: framework/configuration.md
      - Output, Writers & Readers: framework/io.md
  - Physics Modules:
      - physics/index.md
      - The Multistage Picture: physics/overview.md
      - Initial State: physics/initial-state.md
      - Initial-State Radiation (iMATTER): physics/isr.md
      - Pre-equilibrium: physics/pre-equilibrium.md
      - Hydrodynamics: physics/hydro.md
      - Hard Process: physics/hard-process.md
      - Jet Energy Loss: physics/energy-loss.md
      - Hadronization: physics/hadronization.md
      - Particlization & Sampling: physics/particlization.md
      - Hadronic Afterburner: physics/afterburner.md
      - Liquefier & Source Terms: physics/liquefier.md
  - User Guide:
      - guides/index.md
      - Installation: guides/installation.md
      - Running X-SCAPE: guides/running.md
      - Published Tunes: guides/tunes.md
      - Examples: guides/examples.md
  - API Reference:
      - api-overview.md
      - Class List: api/annotated.md
      - Class Index: api/classes.md
      - Class Hierarchy: api/hierarchy.md
      - Namespaces: api/namespaces.md
      - Files: api/files.md
      - Functions: api/functions.md
      - Macros: api/macros.md
  - References: references.md
